name: "Paprika Recipes"
version: "0.3.2"
slug: "paprika_recipes"
description: "Search Paprika recipes from exports or one-way cloud sync"
url: "https://github.com/mark4068-dotcom/Holiday-Let-Manager-Addons/tree/main/paprika_recipes"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8124
panel_icon: mdi:chef-hat
panel_title: "Recipes"
panel_admin: false
ports:
  8124/tcp: null
ports_description:
  8124/tcp: "Optional trusted-LAN dashboard access (no authentication)"
map:
  - type: share
    read_only: false
options:
  source: export
  cloud_email: ""
  cloud_password: ""
  sync_minutes: 360
schema:
  source: list(export|cloud)
  cloud_email: str
  cloud_password: password
  sync_minutes: int(15,1440)
