<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>The recipe shelf</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true">✳</span><div><span class="eyebrow">FROM YOUR PAPRIKA COLLECTION</span><h1>The recipe shelf</h1></div></div><p id="status" role="status">Connecting to your collection…</p></header>
<main><section id="library" aria-label="Recipe library"><div class="intro"><h2>What shall we cook?</h2><p>A little inspiration, from recipes you already love.</p></div><div class="filters"><label class="search"><span>Search your recipes</span><input id="search" type="search" placeholder="Try chicken, lemon…" autocomplete="off"></label><label><span>Category</span><select id="category"><option value="">All categories</option></select></label><button id="favorites" aria-pressed="false">♡ Favourites</button><button id="clear" class="quiet">Clear</button></div><p id="warning" role="alert" hidden></p><div class="results-heading"><h3 id="count" aria-live="polite">Your collection</h3><span>Made for your kitchen</span></div><div id="grid" class="grid"></div><button id="more" hidden>Show more recipes</button></section>
<article id="detail" hidden aria-label="Recipe"><div class="detail-nav"><button id="back">← Back to recipes</button><button id="print" class="quiet">Print recipe</button></div><div id="recipe"></div></article></main><footer>Your recipes, close to hand.</footer></body></html>
