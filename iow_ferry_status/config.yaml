name: "IOW Ferry Status"
version: "0.1.2"
slug: "iow_ferry_status"
description: "Collects live Red Funnel and Wightlink ferry status for HLM"
url: "https://github.com/mark4068-dotcom/IOW_ferry_status"
init: false
arch: [aarch64, amd64]
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8790]/health"
ingress: true
ingress_port: 8790
panel_icon: mdi:ferry
panel_title: "Ferry Status"
panel_admin: true
ports: {"8790/tcp": 8790}
ports_description: {"8790/tcp": "HLM ferry status JSON API"}
map: [{type: app_config, read_only: false}]
options: {refresh_minutes: 5, timezone: "Europe/London", api_token: ""}
schema: {refresh_minutes: "int(2,60)", timezone: str, api_token: password}
